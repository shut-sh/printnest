name: release-bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build bundles (amd64 + arm64)
        run: bash deploy/build-bundle.sh
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/printnest-*-linux-*.tar.gz
            dist/printnest-*-linux-*.tar.gz.sha256
